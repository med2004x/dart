openapi: 3.1.0
info:
  title: Project Task API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  # TODO: add project task collection and item operations.
components:
  schemas:
    Task:
      type: object
      required: [id, projectId, title, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
          enum: [open, blocked, done]
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: string
        requestId:
          type: string
